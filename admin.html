```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebNest - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #2563eb;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-email {
      color: #64748b;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      background: #fee2e2;
      color: #b91c1c;
    }

    main {
      width: min(1150px, 92%);
      margin: 40px auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #64748b;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
    }

    .card h2 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    .description {
      color: #64748b;
      margin-bottom: 20px;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 13px 15px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }

    .quiz-list {
      display: grid;
      gap: 12px;
    }

    .quiz-item {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .quiz-info h3 {
      margin-bottom: 6px;
    }

    .quiz-info p {
      color: #64748b;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    .published {
      background: #dcfce7;
      color: #15803d;
    }

    .draft {
      background: #fef3c7;
      color: #92400e;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .edit {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    .publish {
      background: #dcfce7;
      color: #15803d;
    }

    .unpublish {
      background: #fef3c7;
      color: #92400e;
    }

    .share {
      background: #ede9fe;
      color: #6d28d9;
    }

    .form-section {
      display: none;
      margin-top: 25px;
      border-top: 1px solid #e2e8f0;
      padding-top: 25px;
    }

    .form-section.active {
      display: block;
    }

    .form-title {
      margin-bottom: 20px;
      font-size: 22px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      margin-bottom: 17px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .question-box {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      background: #f8fafc;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .question-header strong {
      font-size: 16px;
    }

    .remove-question {
      background: #fee2e2;
      color: #b91c1c;
      padding: 7px 10px;
      font-size: 12px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .cancel {
      background: #e2e8f0;
      color: #334155;
    }

    .empty,
    .loading {
      color: #64748b;
      padding: 15px 0;
    }

    .request {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .request-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .request-email {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 14px;
      word-break: break-word;
    }

    .scores-table-wrapper {
      overflow-x: auto;
    }

    .scores-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .scores-table th,
    .scores-table td {
      padding: 13px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .scores-table th {
      background: #f1f5f9;
      font-size: 14px;
    }

    .scores-table td {
      font-size: 14px;
    }

    .score-percentage {
      font-weight: 800;
      color: #15803d;
    }

    @media (max-width: 700px) {
      header {
        padding: 16px 20px;
      }

      .user-email {
        display: none;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .quiz-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .option-grid {
        grid-template-columns: 1fr;
      }

      .scores-table th,
      .scores-table td {
        padding: 10px 8px;
      }
    }
  </style>
</head>

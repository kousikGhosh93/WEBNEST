<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebNest Quiz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 7%;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #2563eb;
    }

    main {
      width: min(850px, 92%);
      margin: 35px auto;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
    }

    .quiz-title {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .quiz-info {
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 25px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .question {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      background: #f8fafc;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .option {
      display: block;
      padding: 13px 15px;
      margin-bottom: 9px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option input {
      width: auto;
      margin: 0 8px 0 0;
    }

    .submit-button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-button:hover {
      background: #1d4ed8;
    }

    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .result {
      display: none;
      text-align: center;
      padding: 35px 20px;
    }

    .result-score {
      font-size: 52px;
      font-weight: 800;
      color: #2563eb;
      margin: 15px 0;
    }

    .result-text {
      color: #64748b;
      font-size: 17px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .quiz-title {
        font-size: 25px;
      }

      main {
        margin: 20px auto;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    WebNest
  </div>
</header>

<main>

  <div id="loading" class="card loading">
    Loading quiz...
  </div>

  <div id="quizCard" class="card" style="display:none;">

    <h1 class="quiz-title" id="quizTitle">
      Quiz
    </h1>

    <p class="quiz-info" id="quizInfo"></p>

    <div id="errorMessage" class="message error"></div>

    <label for="studentName">
      Your Name
    </label>

    <input
      id="studentName"
      type="text"
      placeholder="Enter your name"
    >

    <div id="questionsContainer"></div>

    <button
      class="submit-button"
      id="submitButton"
    >
      Submit Quiz
    </button>

  </div>

  <div id="resultCard" class="card result">

    <h2>🎉 Quiz Completed!</h2>

    <div class="result-score" id="resultScore">
      0/0
    </div>

    <p class="result-text" id="resultPercentage">
      0%
    </p>

    <p
      class="result-text"
      id="resultStudent"
      style="margin-top:10px;"
    ></p>

  </div>

</main>


<script type="module">

  import {
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

  import {
    db
  } from "./firebase.js";


  const loading =
    document.getElementById("loading");

  const quizCard =
    document.getElementById("quizCard");

  const resultCard =
    document.getElementById("resultCard");

  const quizTitle =
    document.getElementById("quizTitle");

  const quizInfo =
    document.getElementById("quizInfo");

  const questionsContainer =
    document.getElementById("questionsContainer");

  const studentName =
    document.getElementById("studentName");

  const submitButton =
    document.getElementById("submitButton");

  const errorMessage =
    document.getElementById("errorMessage");

  const resultScore =
    document.getElementById("resultScore");

  const resultPercentage =
    document.getElementById("resultPercentage");

  const resultStudent =
    document.getElementById("resultStudent");


  let currentQuiz = null;
  let currentQuizId = null;


  function showError(text) {

    errorMessage.textContent = text;

    errorMessage.style.display = "block";

  }


  function escapeHtml(value) {

    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getQuizId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get("id");

  }


  async function loadQuiz() {

    currentQuizId =
      getQuizId();


    if (!currentQuizId) {

      loading.textContent =
        "Invalid quiz link.";

      return;

    }


    try {

      const quizRef =
        doc(
          db,
          "quizzes",
          currentQuizId
        );


      const snapshot =
        await getDoc(quizRef);


      if (!snapshot.exists()) {

        loading.textContent =
          "Quiz not found.";

        return;

      }


      const quiz =
        snapshot.data();


      if (!quiz.published) {

        loading.textContent =
          "This quiz is not currently available.";

        return;

      }


      currentQuiz = quiz;


      quizTitle.textContent =
        quiz.title || "Quiz";


      quizInfo.textContent =
        `${quiz.subject || ""} • ${(quiz.questions || []).length} Questions`;


      renderQuestions(
        quiz.questions || []
      );


      loading.style.display =
        "none";

      quizCard.style.display =
        "block";

    } catch (error) {

      console.error(error);

      loading.textContent =
        "Could not load quiz.";

    }

  }


  function renderQuestions(questions) {

    questionsContainer.innerHTML = "";


    questions.forEach(
      (question, index) => {

        const box =
          document.createElement("div");

        box.className =
          "question";


        let optionsHtml = "";


        question.options.forEach(
          (option, optionIndex) => {

            const letter =
              String.fromCharCode(
                65 + optionIndex
              );


            optionsHtml += `

              <label class="option">

                <input
                  type="radio"
                  name="question-${index}"
                  value="${optionIndex}"
                >

                <strong>${letter}.</strong>
                ${escapeHtml(option)}

              </label>

            `;

          }
        );


        box.innerHTML = `

          <div class="question-text">

            ${index + 1}.
            ${escapeHtml(question.question)}

          </div>

          ${optionsHtml}

        `;


        questionsContainer.appendChild(box);

      }
    );

  }


  submitButton.addEventListener(
    "click",
    async () => {

      errorMessage.style.display =
        "none";


      const name =
        studentName.value.trim();


      if (!name) {

        showError(
          "Please enter your name."
        );

        studentName.focus();

        return;

      }


      const questions =
        currentQuiz.questions || [];


      let score = 0;


      for (
        let i = 0;
        i < questions.length;
        i++
      ) {

        const selected =
          document.querySelector(
            `input[name="question-${i}"]:checked`
          );


        if (!selected) {

          showError(
            `Please answer Question ${i + 1}.`
          );

          return;

        }


        const answer =
          Number(selected.value);


        if (
          answer ===
          Number(
            questions[i].correctAnswer
          )
        ) {

          score++;

        }

      }


      const total =
        questions.length;


      const percentage =
        Math.round(
          (score / total) * 100
        );


      submitButton.disabled =
        true;

      submitButton.textContent =
        "Submitting...";


      try {

        const scoreRef =
          doc(
            collection(db, "scores")
          );


        await setDoc(
          scoreRef,
          {

            studentName:
              name,

            quizId:
              currentQuizId,

            quizTitle:
              currentQuiz.title || "",

            score:
              score,

            total:
              total,

            percentage:
              percentage,

            submittedAt:
              new Date().toISOString()

          }
        );


        quizCard.style.display =
          "none";

        resultCard.style.display =
          "block";


        resultScore.textContent =
          `${score}/${total}`;


        resultPercentage.textContent =
          `${percentage}%`;


        resultStudent.textContent =
          `Submitted by ${name}`;

      } catch (error) {

        console.error(error);

        showError(
          "Could not submit your result. Please try again."
        );

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Submit Quiz";

      }

    }
  );


  loadQuiz();

</script>

</body>
</html>

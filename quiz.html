<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebNest - Quiz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #2563eb;
    }

    .home-link {
      text-decoration: none;
      color: #2563eb;
      font-weight: 700;
    }

    main {
      width: min(850px, 92%);
      margin: 40px auto;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .description {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .question {
      margin-bottom: 28px;
    }

    .question h3 {
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .option {
      display: block;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .option input {
      width: auto;
      margin-right: 8px;
      margin-bottom: 0;
    }

    .submit-button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #1d4ed8;
    }

    .result {
      display: none;
      text-align: center;
    }

    .score {
      font-size: 48px;
      font-weight: 800;
      color: #2563eb;
      margin: 15px 0;
    }

    .loading,
    .error {
      text-align: center;
      color: #64748b;
      padding: 30px;
    }

    .error {
      color: #b91c1c;
    }

    .quiz-info {
      color: #64748b;
      margin-bottom: 25px;
    }

    @media (max-width: 600px) {

      header {
        padding: 16px 20px;
      }

      main {
        margin: 25px auto;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }

    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      WebNest
    </div>

    <a
      href="index.html"
      class="home-link">
      ← Home
    </a>

  </header>


  <main>

    <div
      id="quizArea"
      class="card">

      <div class="loading">
        Loading quiz...
      </div>

    </div>


    <div
      id="resultArea"
      class="card result">

      <h1>🎉 Quiz Completed!</h1>

      <p>
        Your score is
      </p>

      <div
        id="score"
        class="score">
        0 / 0
      </div>

      <p id="scoreMessage"></p>

      <div style="margin-top:25px;">

        <a
          href="index.html"
          class="home-link">
          ← Back to Home
        </a>

      </div>

    </div>

  </main>


  <script type="module">

    import {
      collection,
      getDocs,
      addDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    import {
      db
    } from "./firebase.js";


    const quizArea =
      document.getElementById("quizArea");

    const resultArea =
      document.getElementById("resultArea");

    const scoreElement =
      document.getElementById("score");

    const scoreMessage =
      document.getElementById("scoreMessage");


    const params =
      new URLSearchParams(
        window.location.search
      );


    const quizId =
      params.get("id");


    function escapeHtml(value) {

      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    async function loadQuiz() {

      if (!quizId) {

        quizArea.innerHTML = `
          <div class="error">
            Quiz ID is missing.
          </div>
        `;

        return;

      }


      try {

        const snapshot =
          await getDocs(
            collection(db, "quizzes")
          );


        let quiz = null;


        snapshot.forEach((item) => {

          if (item.id === quizId) {

            quiz = {
              id: item.id,
              ...item.data()
            };

          }

        });


        if (!quiz) {

          quizArea.innerHTML = `
            <div class="error">
              Quiz not found.
            </div>
          `;

          return;

        }


        if (quiz.published !== true) {

          quizArea.innerHTML = `
            <div class="error">
              This quiz is not currently available.
            </div>
          `;

          return;

        }


        renderQuiz(quiz);


      } catch (error) {

        console.error(error);

        quizArea.innerHTML = `
          <div class="error">
            Could not load the quiz.
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    function renderQuiz(quiz) {

      const questions =
        quiz.questions || [];


      let html = `

        <h1>
          ${escapeHtml(quiz.title)}
        </h1>

        <p class="description">
          ${escapeHtml(
            quiz.description ||
            "Complete the quiz and submit your answers."
          )}
        </p>

        <div class="quiz-info">

          Subject:
          <strong>
            ${escapeHtml(quiz.subject || "General")}
          </strong>

          &nbsp; | &nbsp;

          Questions:
          <strong>
            ${questions.length}
          </strong>

        </div>


        <form id="quizForm">

          <label>
            Your Name
          </label>

          <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
            required
          >

      `;


      questions.forEach((question, index) => {

        html += `

          <div class="question">

            <h3>
              ${index + 1}.
              ${escapeHtml(question.question)}
            </h3>

        `;


        const options =
          question.options || [];


        options.forEach((option, optionIndex) => {

          const letter =
            String.fromCharCode(
              65 + optionIndex
            );


          html += `

            <label class="option">

              <input
                type="radio"
                name="question-${index}"
                value="${optionIndex}"
              >

              ${letter}. 
              ${escapeHtml(option)}

            </label>

          `;

        });


        html += `

          </div>

        `;

      });


      html += `

          <button
            type="submit"
            class="submit-button">

            Submit Quiz

          </button>

        </form>

      `;


      quizArea.innerHTML = html;


      document
        .getElementById("quizForm")
        .addEventListener(
          "submit",
          (event) => {

            event.preventDefault();

            submitQuiz(quiz);

          }
        );

    }


    async function submitQuiz(quiz) {

      const studentName =
        document
          .getElementById("studentName")
          .value
          .trim();


      if (!studentName) {

        alert(
          "Please enter your name."
        );

        return;

      }


      const questions =
        quiz.questions || [];


      let score = 0;


      questions.forEach(
        (question, index) => {

          const selected =
            document.querySelector(
              `input[name="question-${index}"]:checked`
            );


          if (
            selected &&
            Number(selected.value) ===
              Number(question.correctAnswer)
          ) {

            score++;

          }

        }
      );


      const total =
        questions.length;


      scoreElement.textContent =
        `${score} / ${total}`;


      if (score === total) {

        scoreMessage.textContent =
          "Excellent! You got every question correct. 🎉";

      } else if (score >= total / 2) {

        scoreMessage.textContent =
          "Good job! Keep practising. 👍";

      } else {

        scoreMessage.textContent =
          "Keep practising and try again. 💪";

      }


      quizArea.style.display =
        "none";

      resultArea.style.display =
        "block";


      try {

        await addDoc(
          collection(db, "scores"),
          {

            quizId: quiz.id,

            quizTitle:
              quiz.title || "",

            studentName,

            score,

            total,

            percentage:
              total > 0
                ? Math.round(
                    (score / total) * 100
                  )
                : 0,

            submittedAt:
              new Date().toISOString()

          }
        );

      } catch (error) {

        console.error(
          "Score save error:",
          error
        );

      }

    }


    loadQuiz();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebNest - Quiz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #2563eb;
    }

    .home-link {
      text-decoration: none;
      color: #2563eb;
      font-weight: 700;
    }

    main {
      width: min(850px, 92%);
      margin: 40px auto;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .description {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .quiz-info {
      color: #64748b;
      margin-bottom: 25px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .name-input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 25px;
      outline: none;
    }

    .name-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .question {
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid #e2e8f0;
    }

    .question:last-of-type {
      border-bottom: none;
    }

    .question h3 {
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .option {
      display: block;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }

    .option:hover {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .option input {
      margin-right: 8px;
      cursor: pointer;
    }

    .option.selected {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .submit-button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-button:hover {
      background: #1d4ed8;
    }

    .submit-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 52px;
      font-weight: 800;
      color: #2563eb;
      margin: 15px 0;
    }

    .percentage {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .result-message {
      color: #64748b;
      line-height: 1.6;
    }

    .result-buttons {
      margin-top: 25px;
    }

    .home-button {
      display: inline-block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 700;
    }

    .loading,
    .error {
      text-align: center;
      color: #64748b;
      padding: 30px;
    }

    .error {
      color: #b91c1c;
    }

    .warning {
      display: none;
      background: #fef3c7;
      color: #92400e;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 20px;
      }

      main {
        margin: 25px auto;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }

      .logo {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      WebNest
    </div>

    <a href="index.html" class="home-link">
      ← Home
    </a>

  </header>


  <main>

    <div id="quizArea" class="card">

      <div class="loading">
        Loading quiz...
      </div>

    </div>


    <div id="resultArea" class="card result">

      <div class="result-icon">
        🎉
      </div>

      <h1>
        Quiz Completed!
      </h1>

      <p style="margin-top:10px;">
        Your Score
      </p>

      <div id="score" class="score">
        0 / 0
      </div>

      <div id="percentage" class="percentage">
        0%
      </div>

      <p id="scoreMessage" class="result-message"></p>

      <div class="result-buttons">

        <a href="index.html" class="home-button">
          ← Back to Home
        </a>

      </div>

    </div>

  </main>


  <script type="module">

    import {
      collection,
      getDocs,
      addDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    import {
      db
    } from "./firebase.js";


    const quizArea =
      document.getElementById("quizArea");

    const resultArea =
      document.getElementById("resultArea");

    const scoreElement =
      document.getElementById("score");

    const percentageElement =
      document.getElementById("percentage");

    const scoreMessage =
      document.getElementById("scoreMessage");


    const params =
      new URLSearchParams(
        window.location.search
      );

    const quizId =
      params.get("id");


    let alreadySubmitted = false;


    function escapeHtml(value) {

      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    async function loadQuiz() {

      if (!quizId) {

        quizArea.innerHTML = `
          <div class="error">
            Quiz ID is missing.
          </div>
        `;

        return;
      }


      try {

        const snapshot =
          await getDocs(
            collection(db, "quizzes")
          );


        let quiz = null;


        snapshot.forEach((item) => {

          if (item.id === quizId) {

            quiz = {
              id: item.id,
              ...item.data()
            };

          }

        });


        if (!quiz) {

          quizArea.innerHTML = `
            <div class="error">
              Quiz not found.
            </div>
          `;

          return;
        }


        if (quiz.published !== true) {

          quizArea.innerHTML = `
            <div class="error">
              This quiz is not currently available.
            </div>
          `;

          return;
        }


        renderQuiz(quiz);


      } catch (error) {

        console.error(error);

        quizArea.innerHTML = `
          <div class="error">
            Could not load the quiz.
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    function renderQuiz(quiz) {

      const questions =
        quiz.questions || [];


      if (questions.length === 0) {

        quizArea.innerHTML = `
          <div class="error">
            This quiz has no questions.
          </div>
        `;

        return;
      }


      let html = `

        <h1>
          ${escapeHtml(quiz.title)}
        </h1>

        <p class="description">
          ${escapeHtml(
            quiz.description ||
            "Complete the quiz and submit your answers."
          )}
        </p>

        <div class="quiz-info">

          Subject:
          <strong>
            ${escapeHtml(
              quiz.subject || "General"
            )}
          </strong>

          &nbsp; | &nbsp;

          Questions:
          <strong>
            ${questions.length}
          </strong>

        </div>


        <form id="quizForm">

          <label>
            Your Name
          </label>

          <input
            type="text"
            id="studentName"
            class="name-input"
            placeholder="Enter your name"
            maxlength="50"
            required
          >

          <div
            id="warning"
            class="warning">
          </div>

      `;


      questions.forEach((question, index) => {

        html += `

          <div class="question">

            <h3>
              ${index + 1}.
              ${escapeHtml(
                question.question
              )}
            </h3>

        `;


        const options =
          question.options || [];


        options.forEach(
          (option, optionIndex) => {

            const letter =
              String.fromCharCode(
                65 + optionIndex
              );


            html += `

              <label
                class="option"
                data-question="${index}">

                <input
                  type="radio"
                  name="question-${index}"
                  value="${optionIndex}"
                >

                ${letter}.
                ${escapeHtml(option)}

              </label>

            `;

          }
        );


        html += `

          </div>

        `;

      });


      html += `

          <button
            type="submit"
            class="submit-button"
            id="submitButton">

            Submit Quiz

          </button>

        </form>

      `;


      quizArea.innerHTML = html;


      document
        .querySelectorAll(".option")
        .forEach((option) => {

          option.addEventListener(
            "click",
            () => {

              const questionIndex =
                option.dataset.question;

              document
                .querySelectorAll(
                  `.option[data-question="${questionIndex}"]`
                )
                .forEach((item) => {

                  item.classList.remove(
                    "selected"
                  );

                });


              option.classList.add(
                "selected"
              );

            }
          );

        });


      document
        .getElementById("quizForm")
        .addEventListener(
          "submit",
          (event) => {

            event.preventDefault();

            submitQuiz(quiz);

          }
        );

    }


    async function submitQuiz(quiz) {

      if (alreadySubmitted) {
        return;
      }


      const studentName =
        document
          .getElementById("studentName")
          .value
          .trim();


      if (!studentName) {

        alert(
          "Please enter your name."
        );

        return;
      }


      const questions =
        quiz.questions || [];


      const unanswered = [];


      questions.forEach(
        (question, index) => {

          const selected =
            document.querySelector(
              `input[name="question-${index}"]:checked`
            );


          if (!selected) {

            unanswered.push(
              index + 1
            );

          }

        }
      );


      if (unanswered.length > 0) {

        const warning =
          document.getElementById(
            "warning"
          );


        warning.textContent =
          `Please answer question${
            unanswered.length > 1 ? "s" : ""
          }: ${unanswered.join(", ")}`;


        warning.style.display =
          "block";


        document
          .querySelector(
            `.question:nth-of-type(${unanswered[0] + 1})`
          )
          ?.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });


        return;
      }


      const warning =
        document.getElementById(
          "warning"
        );


      warning.style.display =
        "none";


      const submitButton =
        document.getElementById(
          "submitButton"
        );


      submitButton.disabled =
        true;

      submitButton.textContent =
        "Submitting...";


      let score = 0;


      questions.forEach(
        (question, index) => {

          const selected =
            document.querySelector(
              `input[name="question-${index}"]:checked`
            );


          if (
            selected &&
            Number(selected.value) ===
              Number(question.correctAnswer)
          ) {

            score++;

          }

        }
      );


      const total =
        questions.length;


      const percentage =
        total > 0
          ? Math.round(
              (score / total) * 100
            )
          : 0;


      try {

        await addDoc(
          collection(db, "scores"),
          {

            quizId:
              quiz.id,

            quizTitle:
              quiz.title || "",

            studentName,

            score,

            total,

            percentage,

            submittedAt:
              new Date().toISOString()

          }
        );


        alreadySubmitted =
          true;


        scoreElement.textContent =
          `${score} / ${total}`;


        percentageElement.textContent =
          `${percentage}%`;


        if (percentage === 100) {

          scoreMessage.textContent =
            "Excellent! You got every question correct. 🎉";

        } else if (percentage >= 50) {

          scoreMessage.textContent =
            "Good job! Keep practising. 👍";

        } else {

          scoreMessage.textContent =
            "Keep practising and try again. 💪";

        }


        quizArea.style.display =
          "none";

        resultArea.style.display =
          "block";


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });


      } catch (error) {

        console.error(
          "Score save error:",
          error
        );


        submitButton.disabled =
          false;

        submitButton.textContent =
          "Submit Quiz";


        alert(
          "Could not save your score. Please try again."
        );

      }

    }


    loadQuiz();

  </script>

</body>
</html>

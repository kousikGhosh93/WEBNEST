<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebNest - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      color: #0f172a;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      min-height: 24px;
      margin: 15px 0;
      text-align: center;
      font-size: 14px;
      color: #475569;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 14px;
    }

    .signup a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #2563eb;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">WebNest</div>

    <p class="subtitle">
      Login to your account
    </p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </div>

    <a href="index.html" class="back">
      ← Back to WebNest
    </a>

  </div>

  <script type="module">

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import { auth } from "./firebase.js";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.textContent = "Login successful!";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);

      } catch (error) {

        console.error(error);

        if (error.code === "auth/invalid-credential") {
          message.textContent =
            "Incorrect email or password.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "Too many attempts. Please try again later.";
        } else {
          message.textContent =
            "Login failed. Please try again.";
        }

      }

    });

  </script>

</body>
</html>

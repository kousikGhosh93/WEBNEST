<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebNest - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      color: #0f172a;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      min-height: 24px;
      margin: 15px 0;
      text-align: center;
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 14px;
    }

    .login a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">WebNest</div>

    <p class="subtitle">
      Create your account
    </p>

    <form id="signupForm">

      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
        minlength="6"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back">
      ← Back to WebNest
    </a>

  </div>

  <script type="module">

    import {
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    import {
      auth,
      db
    } from "./firebase.js";

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Creating account...";

      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = userCredential.user;

        await setDoc(
          doc(db, "users", user.uid),
          {
            name: name,
            email: email,
            role: "pending",
            createdAt: new Date().toISOString()
          }
        );

        message.textContent =
          "Account created successfully. Your account is waiting for approval.";

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1800);

      } catch (error) {

        console.error(error);

        if (error.code === "auth/email-already-in-use") {

          message.textContent =
            "This email is already registered.";

        } else if (error.code === "auth/weak-password") {

          message.textContent =
            "Password must contain at least 6 characters.";

        } else if (error.code === "auth/invalid-email") {

          message.textContent =
            "Please enter a valid email address.";

        } else {

          message.textContent =
            "Account creation failed. Please try again.";

        }

      }

    });

  </script>

</body>
</html>
